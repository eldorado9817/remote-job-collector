name: US + UK Remote Software and AI Jobs — Posted Today

on:
  workflow_dispatch:
  schedule:
    # 4:00 AM, 10:00 AM and 4:00 PM Pacific every day (follows PST/PDT automatically).
    - cron: '0 4 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '0 10 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '0 16 * * *'
      timezone: 'America/Los_Angeles'

permissions:
  contents: write
  actions: read

# Keep the daily commit job from racing another scheduled or manual run.
concurrency:
  group: usuk-software-ai-today-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      scan_date: ${{ steps.day.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Determine today's Pacific date once for this run
        id: day
        shell: bash
        run: echo "date=$(TZ=America/Los_Angeles date +%F)" >> "$GITHUB_OUTPUT"
      - name: Auto-discover company boards across ten ATS platforms
        run: python discover_boards.py --minimum 500
      - name: Upload directory for all scan shards
        uses: actions/upload-artifact@v4
        with:
          name: board-directory
          path: |
            discovered_boards.csv
            discovery_summary.json
          retention-days: 3

  scan:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Eight shards are scanned IN PARALLEL each run (not 1/8 per day).
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The artifact service is briefly inconsistent right after upload, and parallel
      # shards sometimes get "No artifacts found". Retry with a pause instead of failing.
      - name: Download board directory (attempt 1/3)
        id: dir1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: board-directory
      - name: Wait before retry
        if: steps.dir1.outcome == 'failure'
        run: sleep 20
      - name: Download board directory (attempt 2/3)
        id: dir2
        if: steps.dir1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: board-directory
      - name: Wait before final retry
        if: steps.dir1.outcome == 'failure' && steps.dir2.outcome == 'failure'
        run: sleep 45
      - name: Download board directory (attempt 3/3)
        if: steps.dir1.outcome == 'failure' && steps.dir2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: board-directory
      - name: Scan shard for today's posted jobs, software/AI, fully remote, US or UK
        shell: bash
        run: |
          EXTRA=''
          # Workable global XML can be very large; run once, not eight times.
          if [ '${{ matrix.shard }}' = '0' ]; then EXTRA='--workable-global'; fi
          python collect_remote_jobs.py \
            --directory discovered_boards.csv \
            --scope usuk \
            --roles software-ai \
            --workplace remote \
            --days 1 \
            --reference-date '${{ needs.discover.outputs.scan_date }}' \
            --max-boards 0 \
            --workers 4 \
            --shard-count 8 \
            --skip-workable-boards \
            --shard-index '${{ matrix.shard }}' \
            --output 'jobs_shard_${{ matrix.shard }}' \
            $EXTRA
      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-shard-${{ matrix.shard }}
          path: jobs_shard_${{ matrix.shard }}_*
          if-no-files-found: warn
          retention-days: 3

  aggregate:
    needs: [discover, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The artifact service is briefly inconsistent right after upload, and parallel
      # shards sometimes get "No artifacts found". Retry with a pause instead of failing.
      - name: Download board directory (attempt 1/3)
        id: dir1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: board-directory
      - name: Wait before retry
        if: steps.dir1.outcome == 'failure'
        run: sleep 20
      - name: Download board directory (attempt 2/3)
        id: dir2
        if: steps.dir1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: board-directory
      - name: Wait before final retry
        if: steps.dir1.outcome == 'failure' && steps.dir2.outcome == 'failure'
        run: sleep 45
      - name: Download board directory (attempt 3/3)
        if: steps.dir1.outcome == 'failure' && steps.dir2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: board-directory
      - name: Download shard results (attempt 1/2)
        id: shards1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ats-shard-*
          path: shards
          merge-multiple: false
      - name: Wait before retry
        if: steps.shards1.outcome == 'failure'
        run: sleep 30
      - name: Download shard results (attempt 2/2)
        if: steps.shards1.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          pattern: ats-shard-*
          path: shards
          merge-multiple: false
      - name: Merge all eight shards (fail if one is missing)
        run: python combine_shard_results.py --shards 8
      - name: Update cumulative repository CSV
        run: python merge_job_results.py
      - name: Commit results to repository
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs_all.csv
          if git diff --cached --quiet; then
            echo 'No changes to cumulative CSV'
          else
            git commit -m 'Update US/UK remote software and AI jobs'
            git push origin "HEAD:${BRANCH}"
          fi
      - name: Upload combined CSVs, cumulative history, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today-us-uk-remote-software-ai-${{ github.run_number }}
          path: |
            jobs_us_uk_remote.csv
            jobs_review_location.csv
            jobs_remote_candidates.csv
            jobs_all.csv
            jobs_errors.txt
            discovered_boards.csv
            discovery_summary.json
            scan_summary.json
          retention-days: 14
          if-no-files-found: warn
